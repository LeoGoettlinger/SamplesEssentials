isEnabled: true
powerType: UNIQUE
eliteScript:
  MainScript:
    Events:
    - EliteMobDamagedByPlayerEvent
    Zone:
      shape: CYLINDER
      radius: 6
      height: 1
      Target:
        targetType: LOCATION
        location: same_as_boss,66.5,65,205.5,-123.0,0
    Actions:
    - action: POTION_EFFECT
      wait: 140
      Target:
        targetType: NEARBY_PLAYERS
        range: 50
      potionEffectType: BLINDNESS
      amplifier: 0
      duration: 60
      Conditions:
        conditionType: BLOCKING
        isAlive: true
        Target:
          targetType: SELF
    - action: TELEPORT
      wait: 145
      Target:
        targetType: NEARBY_PLAYERS
        range: 50
      FinalTarget:
        targetType: ZONE_FULL
      Conditions:
        conditionType: BLOCKING
        isAlive: true
        Target:
          targetType: SELF
    - action: TAG
      Target:
        targetType: SELF
      tags:
      - FindMe
      Conditions:
        conditionType: BLOCKING
        isAlive: true
        Target:
          targetType: SELF
    - action: TAG
      wait: 170
      Target:
        targetType: SELF
      tags:
      - PlsStop
      Conditions:
        conditionType: BLOCKING
        isAlive: true
        Target:
          targetType: SELF
    - action: RUN_SCRIPT
      wait: 150
      scripts:
      - DelayedActions
      Conditions:
        conditionType: BLOCKING
        isAlive: true
        Target:
          targetType: SELF
    Cooldowns:
      local: 99999
      global: 1
  RemoveTag:
    Events:
    - EliteMobDamagedByPlayerEvent
    Actions:
    - action: UNTAG
      Target:
        targetType: SELF
      tags:
      - FindMe
      Conditions:
        hasTags:
        - PlsStop
        Target:
          targetType: SELF
    - action: DAMAGE
      Target:
        targetType: NEARBY_MOBS
        range: 60
      multiplier: 99.9
      Conditions:
        hasTags:
        - ShadowClone
        Target:
          targetType: ACTION_TARGET
  DelayedActions:
    Zone:
      shape: CYLINDER
      radius: 30
      height: 1
      Target:
        targetType: SELF_SPAWN
        offset: 0,2,0
    Actions:
    - action: POTION_EFFECT
      Target:
        targetType: SELF
      potionEffectType: SLOW
      amplifier: 20
      duration: 20
      repeatEvery: 19
      Conditions:
        hasTags:
        - FindMe
        Target:
          targetType: SELF
    - action: POTION_EFFECT
      Target:
        targetType: NEARBY_PLAYERS
        range: 60
      potionEffectType: DARKNESS
      amplifier: 0
      duration: 100
      repeatEvery: 50
      Conditions:
        hasTags:
        - FindMe
        Target:
          targetType: SELF
    - action: MESSAGE
      Target:
        targetType: NEARBY_PLAYERS
        range: 60
      sValue: '&7The darkness is sapping your life force. Find the &eHolder of Misery
        &7before it is too late!'
      Conditions:
        conditionType: BLOCKING
        isAlive: true
        Target:
          targetType: SELF
    - action: PLAY_SOUND
      Target:
        targetType: NEARBY_PLAYERS
        range: 60
