name: '&2Deep Down!'
questLore:
- We have a small team of guild members deployed at the bottom of the lift, they have
  set up there with measuring tools.
- We have found the entrance to the Nether, well I mean we know in which direction
  it is.
- But more concerning we are sure we have also picked energy signals from whatever
  caused the dwarves' corruption.
- The signals are very strong and like nothing we have witnessed before.
- It is very concerning... But, back to the task at hand.
- The direction to the Nether entrance has been blocked off by cave-ins.
- Thankfully there is a lot of TNT left behind.
