# AllayAC it by SampleCraft
prefix: "&cAllayAC &8»"
alerts-enabled: "%prefix% &fAlerts enabled"
alerts-disabled: "%prefix% &fAlerts disabled"
reloaded: "%prefix% &fConfig+punishments reloaded."
player-not-found: "%prefix% &cPlayer not found!"
lockdown-on: "%prefix% &cLockdown ON"
lockdown-off: "%prefix% &aLockdown OFF"
alerts-format: "%prefix% &f%player% &bfailed &f%check_name% &f(x&c%vl%&f) &7%verbose%"
help:
  - "&7======================"
  - "/allayac reload &f- Reload+punishments"
  - "/allayac vl <p> [check] &f- VL"
  - "/allayac info &f- Info"
  - "/allayac alerts &f- Alerts"
  - "/allayac debug &f- Debug"
  - "/allayac selftest &f- Self-test"
  - "/allayac lockdown &f- Lockdown"
  - "/allayac config <p> <v> &f- Config"
  - "&7======================"
