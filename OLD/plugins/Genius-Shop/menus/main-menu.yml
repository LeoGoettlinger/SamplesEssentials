  smithing:
    slot: 22
    material: NETHERITE_UPGRADE_SMITHING_TEPLATE
    name: '&7&lSmithing'
    lore:
      - ''
      - '&Ambosse, Smithing Templates und co.!'
      - '&7Available: &e%available-times%'
      - ''
    shop-key: smithing


  weekend_market:
    slot: 23
    material: NETHER_STAR
    name: '&d&lWeekend Market'
    lore:
      - ''
      - '&7Sonderangebote & exklusive Items!'
      - '&7Nur &dSamstag - Sonntag&7, 0-24 Uhr'
      - '&7Rabatte auf Blocke, Waffen, Trim!'
      - '&7Available: &e%available-times%'
      - ''
    shop-key: weekend_market
    available-times:
      - Saturday-Sunday
      - "00:00-23:59"

