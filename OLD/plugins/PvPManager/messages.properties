# You can customize these messages to your language, change colors, etc
# You can disable any message by deleting everything after the equals (=)
# Example: Newbie_Protection = (leave this empty)
# You may also use Hex color codes such as &#FFFFFF in MC 1.16+
# There are some variables you can use in this file that work in all messages
# such as {prefix} and some that only work where they make sense such as {player}, {time} and {money}
#
# You can prefix any message with !actionbar or !chat to control where it appears
# - !actionbar = Message shows above hotbar (recommended for frequent spam messages)
# - !chat = Message shows in chat (default if no prefix)

Prefix = &2&lɴɪxᴏʀɪᴀ &8▸ 

# PvP Toggle (Wird ohnehin per Permission deaktiviert, aber hier sicherheitshalber übersetzt)
PvP_Disabled = {prefix} &aPvP deaktiviert! Du bist jetzt geschützt.
PvP_Enabled = {prefix} &cPvP aktiviert! Du kannst jetzt angreifen und angegriffen werden.
Attack_Denied_You = !actionbar {prefix} &#c9453eDu hast PvP-Schutz!
Attack_Denied_Other = !actionbar {prefix} &f{player} &#c9453ehat PvP-Schutz!
PvP_Force_Enabled_WorldGuard = {prefix} &6PvP-Schutz in dieser PvP-Region deaktiviert.
PvP_Disabled_Fee = {prefix} &aDu hast eine Gebühr von &#FFD700{money} &agezahlt, weil PvP deaktiviert war.
PvP_Disabled_Fee_Not_Enough = {prefix} &6PvP-Schutz deaktiviert - unzureichende Mittel für die Gebühr.

# Combat Tag
Tagged_Attacker = {prefix} &7Du hast &f{player} &7markiert! Logge dich nicht aus!
Tagged_Defender = {prefix} &7Markiert von &f{player}&7! Logge dich nicht aus!
Out_Of_Combat = {prefix} &aDu bist nicht mehr im Kampf.
Out_Of_Combat_ActionBar = &aDu bist nicht mehr im Kampf.
Duel_Mode_Protection = !actionbar {prefix} &#c9453eDieser Spieler kämpft bereits gegen jemand anderen!
Command_Denied_InCombat = {prefix} &cBefehl verweigert! Du bist noch im Kampf!
Block_Place_Blocked_InCombat = !actionbar {prefix} &cDu kannst im Kampf keine Blöcke platzieren!
Block_Break_Blocked_InCombat = !actionbar {prefix} &cDu kannst im Kampf keine Blöcke abbauen!
Eating_Blocked_InCombat = !actionbar {prefix} &cEssen ist im Kampf blockiert!
Elytra_Blocked_InCombat = !actionbar {prefix} &cDu kannst im Kampf keine Elytra nutzen!
Firework_Blocked_InCombat = !actionbar {prefix} &cDu kannst im Kampf keine Feuerwerke beim Gleiten nutzen!
Firework_Power_Limited_InCombat = !actionbar {prefix} &cDu kannst im Kampf keine Feuerwerke mit Stufe &f{power} &cnutzen!
EnderPearl_Blocked_InCombat = {prefix} &cDu kannst im Kampf keine Enderperlen nutzen!
ChorusFruit_Blocked_InCombat = {prefix} &cDu kannst im Kampf keine Chorusfrüchte essen!
Interact_Blocked_InCombat = !actionbar {prefix} &cDu kannst im Kampf nicht rechts-klicken!
Teleport_Blocked_InCombat = {prefix} &cDu kannst dich im Kampf nicht teleportieren!
Totem_Blocked_InCombat = {prefix} &cTotems sind im Kampf blockiert!
Inventory_Blocked_InCombat = !actionbar {prefix} &cDu kannst im Kampf kein Inventar öffnen!
Pushback_Warning = {prefix} &#c9453eDu kannst im Kampf nicht in Safezones flüchten!

# Newbie Protection
Newbie_Protection = {prefix} &aWillkommen! Du bist für &e{time} &avor PvP geschützt.
Newbie_Protection_End = {prefix} &6Dein PvP-Schutz ist abgelaufen! Du kannst jetzt angegriffen werden.
Newbie_Protection_Removed = {prefix} &aDu hast deinen PvP-Schutz entfernt! Sei vorsichtig.
Newbie_Protection_On_Hit = {prefix} &#c9453eDu hast PvP-Schutz! Wenn du wirklich PvP willst, entferne ihn mit &f/newbie disable.
Newbie_Protection_Attacker = !actionbar {prefix} &f{player} &#c9453ehat Newbie-Schutz!
Newbie_Time_Check = {prefix} &7Du bist noch für &e{time} &7vor PvP geschützt.
Newbie_Time_Check_Other = {prefix} &f{player} &7ist noch für &e{time} &7vor PvP geschützt.
Newbie_Command_Blocked = {prefix} &cDu kannst diesen Befehl nicht nutzen, während du Newbie-Schutz hast!
Newbie_Pickup_Items_Blocked = !actionbar {prefix} &cDu kannst keine Items aufheben, während du Newbie-Schutz hast!
Newbie_Force_Removed_WorldGuard = {prefix} &6Dein Newbie-Schutz wurde entfernt, da du dich in einer PvP-Region befindest.

# Respawn Protection
Respawn_Protection = !actionbar {prefix} &#c9453eDu hast Respawn-Schutz!
Respawn_Protection_Other = !actionbar {prefix} &f{player} &#c9453ehat Respawn-Schutz!

# World Protection
World_Protection = !actionbar {prefix} &#c9453ePvP ist in dieser Welt deaktiviert!

# AFK Protection
AFK_Protection = !actionbar {prefix} &#c9453eDieser Spieler kann im AFK-Modus nicht angegriffen werden!

# Global Protection
Global_Protection = !actionbar {prefix} &#c9453ePvP-Kampf ist global deaktiviert!

# Player Kills
Money_Reward = {prefix} &aDu hast &#FFD700{money} &aCoins für den Kill an &f{victim} &aerhalten!
Money_Penalty = {prefix} &cDu hast &#FFD700{money} &cCoins durch deinen Tod verloren!
Money_Steal = {prefix} &f{player} &chat dir &#FFD700{money} &cCoins gestohlen!
Exp_Won = {prefix} &aDu hast &e{exp} &aErfahrungspunkte für den Kill an &f{victim} &aerhalten!
Exp_Stolen = {prefix} &f{player} &6hat dir &e{exp} &6Erfahrungspunkte gestohlen!

# Kill Abuse
Kill_Abuse_Warning = {prefix} &cDu wirst bestraft, wenn du diesen Spieler noch einmal tötest! Bitte hör auf.

# Item Cooldown
Item_Cooldown = !actionbar {prefix} &cDu kannst das noch nicht nutzen! Verfügbar in &e{time}

# Commands
Error_Permission = &cDu hast keine Berechtigung dafür!
Error_Player_Not_Found = &cSpieler nicht gefunden: &f{player}
Error_Not_Player = &cDieser Befehl ist nur für Spieler verfügbar!
# Newbie Command
Error_Not_Newbie = {prefix} &cDu bist kein Newbie!
# PvP Command
Error_PvP_Cooldown = {prefix} &cDu kannst PvP noch nicht umschalten! Warte &e{time}
Error_PvPToggle_NoPvP = {prefix} &cDu darfst PvP nicht aktivieren!
Error_PvPToggle_ForcePvP = {prefix} &cDu darfst PvP nicht deaktivieren!
PvPToggle_Admin_Changed = {prefix} &aPvP-Status von &f{player} &awurde auf &f{state} &ageändert.
PvPToggle_Already_Disabled = {prefix} &cDu hast PvP bereits deaktiviert!
PvPToggle_Already_Enabled = {prefix} &cDu hast PvP bereits aktiviert!
