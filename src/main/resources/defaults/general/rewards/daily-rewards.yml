# ============================================
# Daily Rewards - Tägliche Login-Belohnungen
# Streak-Modus: Verliert Fortschritt bei verpasstem Tag
# ============================================
type: daily-rewards
enabled: true

# Reward mode: streak = resets if a day is missed
reward-mode: streak
# Resets player back to day 1 (-1 to disable)
reset-days-at: -1
# Whether players will receive all rewards on a day or just the one with the highest priority
allow-reward-stacking: false
# Whether streaks will continue during maintenance
streak-bypass: false

# The redeem sound to play if unspecified
default-redeem-sound: ENTITY_PLAYER_LEVELUP
# Whether notifications should be sent when rewards are claimable
enable-notifications: true

# Upcoming category to display
upcoming-category: large

reward-placeholders:
  claimed: "true"
  unclaimed: "false"

