# ============================================================== #
#                     VRX Clans - Configuration                  #
# ============================================================== #

language: "en_US"
max-members: 15
name-length-min: 3
name-length-max: 12
blocked-names:
  - Admin
  - Staff
  - Server
  - Owner
  - System
  - Console
join-cooldown: 86400
invite-timeout: 60

clan-creation-cost: 1000.0
clan-rename-cost: 500.0
ally-creation-cost: 100.0
base-teleport-cost: 10.0
upkeep-cost: 500.0
upkeep-interval-hours: 24
upkeep-penalty-level-drop: true

level-up-multiplier: 1000.0
xp-per-blockbreak: 1.0
xp-per-monsterkill: 5.0
xp-per-playerkill: 10.0

disable-friendly-fire: true
disable-ally-fire: true
max-allies: 3
max-rivals: 3
war-kill-target: 50
war-min-wager: 1000.0

base-teleport-delay: 3
base-base-radius: 10
base-bonus-per-member: 5
vault-unlock-level: 3
vault-upgrade-level: 10

quests:
  reset-interval-hours: 24
  zombies:
    target: 5000
    reward-xp: 1000.0
  diamonds:
    target: 1000
    reward-xp: 1500.0
  bank:
    target: 10000.0
    reward-xp: 2000.0

shop:
  enable-radius: true
  enable-xp: true
  enable-haste: true
  enable-speed: true
  enable-strength: true
  enable-base-regen: true
  enable-base-saturation: true
  booster-hours: 1
  radius-cost: 5000
  radius-add: 5
  xp-cost: 2000
  haste-cost: 3000
  speed-cost: 3000
  strength-cost: 5000
  base-regen-cost: 50000
  base-saturation-cost: 50000
  extended:
    members:
      enabled: true
      cost: 10000.0
      add: 1
      max-purchases: 10
    homes:
      enabled: true
      cost: 7500.0
      add: 1
      max-purchases: 5
    vault:
      enabled: true
      cost: 15000.0
      add: 1
      max-purchases: 3
    allies:
      enabled: true
      cost: 12000.0
      add: 1
      max-purchases: 5
    rivals:
      enabled: true
      cost: 12000.0
      add: 1
      max-purchases: 5
    teleport:
      enabled: true
      cost: 10000.0
      add: 1
      max-purchases: 3

clan-chat-format: "&8[&b%clan%&8] &7%player% &8» &f%message%"
prefix-in-global-chat: true
global-chat-prefix-format: "&8[%tagcolor%%tag%&8] "

gui-theme: "default"
gui-theme-color: "GRAY_STAINED_GLASS_PANE"


auto-save-interval: 10
top-cache-refresh-seconds: 60

# Clan data lives in clans.yml inside the module folder (no MySQL needed)

season-reward: 50000.0

diplomacy-request-timeout: 120

war:
  kill-farming-cooldown-seconds: 300

# Clan level rewards. The key is the reached clan level.
# bank: Money added directly to the clan bank
# commands: Console commands with %clan%, %level%, %bank%
level-rewards:
  "3":
    bank: 2500.0
    message: "&aYour clan reached level &e%level% &aand received &e%bank%$&a!"
    commands: []
  "5":
    bank: 10000.0
    message: "&6Great work! Level &e%level% &6has been reached."
    commands:
      - "broadcast &bClan %clan% reached level %level%!"

# --------------------------------------------------
# New Clan Social/Progression Features
# --------------------------------------------------
clan-tags:
  enabled: true
  auto-generate-from-name: true
  min-length: 2
  max-length: 5
  blocked-tags:
    - "ADMIN"
    - "MOD"
    - "TEAM"
  allowed-colors:
    - "&7"
    - "&f"
    - "&a"
    - "&b"
    - "&c"
    - "&d"
    - "&e"
    - "&6"
  chat:
    enabled: true
    format: "&8[%tagcolor%%tag%&8] "
  tab:
    enabled: true
    format: "&8[%tagcolor%%tag%&8] &f%player%"

homes:
  enabled: true
  default-max: 1
  level-unlocks:
    "1": 1
    "10": 2
    "20": 3

achievements:
  enabled: true
  definitions:
    first_steps:
      name: "First Steps"
      condition: "members"
      target: 1
      rewards:
        bank: 500.0
        xp: 250.0
        commands: []
    growing_clan:
      name: "Growing Clan"
      condition: "members"
      target: 5
      rewards:
        bank: 2500.0
        xp: 1000.0
        commands: []
    rich_clan:
      name: "Rich Clan"
      condition: "bank"
      target: 100000
      rewards:
        bank: 10000.0
        xp: 2500.0
        commands:
          - "broadcast &bClan %clan% unlocked the achievement %achievement%!"
    warriors:
      name: "Warriors"
      condition: "kills"
      target: 100
      rewards:
        bank: 5000.0
        xp: 2000.0
        commands: []
    legends:
      name: "Legends"
      condition: "level"
      target: 25
      rewards:
        bank: 25000.0
        xp: 0.0
        commands:
          - "broadcast &6Clan %clan% is now legendary!"

applications:
  enabled: true
  expire-minutes: 60


# --------------------------------------------------
# v1.0.4 Clan Profile, Mail/MOTD, Top Cache & Extended Shop
# --------------------------------------------------
profiles:
  enabled: true
  description-max-length: 160
  allowed-icons:
    - SHIELD
    - DIAMOND_SWORD
    - NETHER_STAR
    - EMERALD
    - DRAGON_EGG

mail:
  enabled: true
  max-messages: 25
  motd-on-join: true
  mail-notify-on-join: true

admin-editor:
  enabled: true

help-lines:
  - "&8[&bClans&8] &7commands"
  - " &f/clan create <name> &8- &7found a clan"
  - " &f/clan join | leave | disband &8- &7membership"
  - " &f/clan invite | kick | promote | demote <player>"
  - " &f/clan bank | deposit <n> | withdraw <n>"
  - " &f/clan ally | rival | neutral <clan>"
  - " &f/clan setbase | base &8- &7clan base + teleport"
  - " &f/clan chat &8- &7toggle clan chat"
  - " &f/clan info [clan] | list | rename <name> | motd <text>"
