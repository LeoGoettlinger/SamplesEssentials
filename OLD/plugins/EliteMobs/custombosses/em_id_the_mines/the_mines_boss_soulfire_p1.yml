eliteScript:
  DeleteBonfire:
    Actions:
    - Target:
        targetType: ZONE_FULL
      action: PLACE_BLOCK
      material: AIR
      wait: 5
    - Target:
        coverage: 0.05
        targetType: ZONE_FULL
      action: SPAWN_PARTICLE
      particles:
      - particle: EXPLOSION_HUGE
      repeatEvery: 5
      times: 3
    - Target:
        targetType: SELF
      action: PLAY_SOUND
      sValue: entity.dragon_fireball.explode
      wait: 5
    Cooldowns:
      global: 1
      local: 99999
    Events:
    - EliteMobEnterCombatEvent
    - EliteMobTargetPlayerEvent
    Zone:
      Target:
        offset: 0,-2,0
        targetType: SELF
      radius: 3
      shape: DOME
  Sleep:
    Actions:
    - Target:
        targetType: SELF
      action: SET_MOB_AI
      bValue: false
    Events:
    - EliteMobSpawnEvent
  WakeUp:
    Actions:
    - Target:
        targetType: SELF
      action: SET_MOB_AI
      bValue: true
    - Target:
        targetType: ZONE_FULL
      action: DAMAGE
      multiplier: 0.1
      repeatevery: 5
      times: 1
    Events:
    - EliteMobDamagedByPlayerEvent
    Zone:
      Target:
        offset: 0,-1,0
        targetType: SELF_SPAWN
      filter: ELITE
      height: 4
      radius: 1
      shape: CYLINDER
  Wall:
    Actions:
    - Conditions:
        Target:
          targetType: SELF
        conditionType: BLOCKING
        isAlive: true
      Target:
        targetType: ZONE_FULL
      action: PUSH
      repeatEvery: 1
      vValue: 0,0,2
    Zone:
      Target:
        location: same_as_boss,275,134,137,0,0
        targetType: LOCATION
      shape: CUBOID
      x: 30
      y: 30
      z: 2
  WallVs:
    Actions:
    - action: RUN_SCRIPT
      scripts:
      - Wall
    - Conditions:
        Target:
          targetType: SELF
        conditionType: BLOCKING
        isAlive: true
      Target:
        coverage: 0.1
        targetType: ZONE_FULL
      action: SPAWN_PARTICLE
      particles:
      - particle: EXPLOSION_NORMAL
      repeatEvery: 10
    Cooldowns:
      global: 10
      local: 99999
    Events:
    - EliteMobEnterCombatEvent
    Zone:
      Target:
        location: same_as_boss,275,134,138,0,0
        targetType: LOCATION
      shape: CUBOID
      x: 30
      y: 30
      z: 1
