eliteScript:
  SpawnPrep:
    Events:
    - EliteMobSpawnEvent
    Actions:
    - action: SET_MOB_AWARE
      bValue: false
      Target:
        targetType: SELF
    - action: TELEPORT
      Target:
        targetType: SELF
      FinalTarget:
        targetType: SELF_SPAWN
      repeatEvery: 200
  TridentToss:
    Events:
    - EliteMobDamagedByPlayerEvent
    Actions:
    - action: PLAY_SOUND
      sValue: minecraft:item.trident.throw
      volume: 1.4
      Target:
        targetType: SELF
    - action: SUMMON_ENTITY
      wait: 24
      sValue: TRIDENT
      repeatEvery: 10
      times: 4
      Target:
        targetType: SELF
      RelativeVector:
        SourceTarget:
          targetType: SELF
        DestinationTarget:
          targetType: NEARBY_PLAYERS
          range: 30
        normalize: true
        multiplier: 2.5
    Cooldowns:
      local: 120
      global: 1
