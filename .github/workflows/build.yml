name: Build SamplesEssentials

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          set +e
          ./gradlew --no-daemon --console=plain build 2>&1 | tee build-log.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && [ "${{ github.event_name }}" = "push" ]; then
            git config user.name "SamplesEssentials Bot"
            git config user.email "bot@samplecraft.su"
            git add -f build-log.txt
            git commit -q -m "chore: build log (failed build) [skip ci]" || true
            git push || true
          fi
          exit "$status"

      - name: Upload jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SamplesEssentials-jar
          path: build/libs/SamplesEssentials-*.jar
          if-no-files-found: error

      - name: Attach jar to a release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/SamplesEssentials-*.jar
