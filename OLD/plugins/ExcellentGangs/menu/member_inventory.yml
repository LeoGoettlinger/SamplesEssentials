      Display_Name: <soft_red>No Helmet</soft_red>
      Lore: []
  Chest:
    Slot: 39
    Placeholder:
      Material: minecraft:red_stained_glass_pane
      Display_Name: <soft_red>No Chestplate</soft_red>
      Lore: []
  Legs:
    Slot: 40
    Placeholder:
      Material: minecraft:red_stained_glass_pane
      Display_Name: <soft_red>No Leggings</soft_red>
      Lore: []
  Feet:
    Slot: 41
    Placeholder:
      Material: minecraft:red_stained_glass_pane
