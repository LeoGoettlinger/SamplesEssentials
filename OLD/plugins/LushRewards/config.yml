  # Template for upcoming reward
  upcoming-reward:
    lore:
      - "&7&o- Kommt bald..."
  # Template for border items - more items can be created like this to be used within the gui templates
  '#':
    material: light_blue_stained_glass_pane
    display-name: "&7"

