PvPInfo_Header = &#FFD700▬▬▬▬▬ Spieler-Info: #f09a11{player} &#FFD700▬▬▬▬▬
PvPInfo_UUID = &8├ &7UUID: &f
PvPInfo_Combat = &8├ &7Kampf: &f
PvPInfo_Protection = &8├ &7Schutz: &f
PvPInfo_World = &8├ &7Welt: &f
PvPInfo_Override = &8├ &7Überschreibung: &f
PvPInfo_Enemies = &8├ &7Feinde: &f
PvPInfo_Exemptions = &8└ &7Ausnahmen: &f
PvPInfo_Footer = &#FFD700▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
# PvPList Command
PvPList_Title = &#FFD700&l---- Spieler mit PvP ----
PvPList_Enabled = &a&lAktiviert
PvPList_Disabled = &c&lDeaktiviert
