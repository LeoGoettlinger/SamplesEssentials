title: '&8&lShop Menu'
rows: 6

items:
  # ==========================================
  # MITTE OBEN: Info-Button (Slot 4)
  # ==========================================
  info:
    slot: 4
    material: WRITABLE_BOOK
    name: '&c&lServer-Shop Info'
    lore:
      - ''
      - '&6&lServer-SHOP'
      - '&7Made by &bDralle'
      - '&6Configured by SampleCraft'
      - '&7Version: &b%version%'
      - '%update-available%'
      - ''
      - '&7Hier kannst du Dinge kaufen'
      - '&7und verkaufen!'
      - '&79 Shops mit &e1000+ Items&7!'
      - ''

  # ==========================================
  # REIHE 2: Haupt-Shops (Slots 10-16)
  # ==========================================
  blocks:
    slot: 10
    material: STONE_BRICKS
    name: '&b&lBlocks'
    lore:
      - ''
      - '&7Baublocke, Holz, Glas,'
      - '&7Wolle, Stein, Erde...'
      - '&7Uber 400 Items!'
      - '&7Available: &e%available-times%'
      - ''
    shop-key: blocks

  farming:
    slot: 11
    material: GOLDEN_HOE
    name: '&a&lFarming'
    lore:
      - ''
      - '&7Setzlinge, Blumen, Ernten,'
      - '&7Samen, Tiere, Leuchtbeeren...'
      - '&7Available: &e%available-times%'
      - ''
    shop-key: farming

  premium:
    slot: 12
    material: EMERALD
    name: '&6&lPremium & Materials'
    lore:
      - ''
      - '&7Erze, Diamanten, Netherite,'
      - '&7Rustung, Werkzeuge, Trims...'
      - '&7Available: &e%available-times%'
      - ''
    shop-key: premium

  spawners:
    slot: 13
    material: SPAWNER
    name: '&c&lSpawners'
    lore:
      - ''
      - '&7Mob-Spawner aller Art!'
      - '&7Passiv, Feindlich, Nether, End...'
      - '&7Available: &e%available-times%'
      - ''
    shop-key: spawners
    hide-attributes: true
    hide-additional: true

  misc:
    slot: 14
    material: CHEST
    name: '&f&lMisc Items'
    lore:
      - ''
      - '&7Eimer, Maps, Sattel,'
      - '&7Rustungsstander, Farbstoffe,'
      - '&7Topferscherben...'
      - '&7Available: &e%available-times%'
      - ''
    shop-key: misc

  food_cooking:
    slot: 15
    material: COOKED_BEEF
    name: '&6&lFood & Cooking'
    lore:
      - ''
      - '&7Essen, Roh & Gekocht,'
      - '&7Suppen, Kuchen, Goldene Apfel!'
      - '&7Available: &e%available-times%'
      - ''
    shop-key: food_cooking

  redstone_tech:
    slot: 16
    material: REDSTONE
    name: '&c&lRedstone Tech'
    lore:
      - ''
      - '&7Redstone, Piston, Hopper,'
      - '&7Schienen, Komparatoren,'
      - '&7Repeater, Observer...'
      - '&7Available: &e%available-times%'
      - ''
    shop-key: redstone_tech

  # ==========================================
  # REIHE 3: Spezial-Shops (zentriert)
  # ==========================================
  potions_brewing:
    slot: 21
    material: POTION
    name: '&5&lPotions & Brewing'
    lore:
      - ''
      - '&7Tranke, Wurftranke,'
      - '&7Verweiltranke, Brau-Zutaten,'
      - '&7Spezialpfeile & Pfeile!'
