  weapon-lore:
    sculk_crossbow:
      - ""
      - "&e➽ &fSchuss - Feuert einen Strahl,"
      - "&fder eine Sculk-Explosion auslöst"
      - "&fund Sculk verbreitet."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    mjolnir:
      - ""
      - "&e➽ &fRechtsklick - Wirft einen Hammer,"
      - "&fder Feinde mit Blitzen trifft,"
      - "&fdann kehrt er zurück."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    shadow_blade:
      - ""
      - "&e➽ &fRechtsklick - Macht dich kurz"
      - "&funsichtbar und gibt Tempo."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    reaper_scythe:
      - ""
      - "&e➽ &fTreffer - Stiehlt positive"
      - "&fEffekte und heilt dich."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    villager_staff:
      - ""
      - "&e➽ &fRechtsklick - Erzeugt einen Explosionsstrahl,"
      - "&ftötet Wesen und erhält"
      - "&fSmaragde."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    dragon_katana:
      - ""
      - "&e➽ &fRechtsklick - Teleportiert dich"
      - "&fin Blickrichtung."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    awakened_dragon_katana:
      - ""
      - "&e➽ &fRechtsklick - Teleportiert dich"
      - "&fin Blickrichtung und hinterlässt"
      - "&feine Spur aus Explosionen."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    excalibur:
      - ""
      - "&e➽ &fRechtsklick - Gewährt dir kurze"
      - "&fUnsterblichkeit."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    void_staff:
      - ""
      - "&e➽ &fRechtsklick - Öffnet Portale,"
      - "&fdie sich gegenseitig teleportieren."
      - "&fRechtsklick - Feuert eine Shulker-Ladung."
      - "&fLinksklick - Wechselt den Modus."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    magma_club:
      - ""
      - "&e➽ &fRechtsklick - Entzündet und stößt"
      - "&fFeinde mit einer Feuerwelle zurück."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    shrink_ray:
      - ""
      - "&e➽ &fSchuss - Feuert einen Strahl, der"
      - "&fden Feind mehrfach vergrößert."
      - "&fLinksklick - Verkleinert dich."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    chainsaw_sword:
      - ""
      - "&e➽ &fRechtsklick - Verflucht die Klinge,"
      - "&fder nächste Treffer lässt bluten."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    wither_sickles:
      - ""
      - "&e➽ &fRechtsklick - Wirft eine Sichel,"
      - "&fdie Feinde verdorren lässt."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    awakened_wither_sickles:
      - ""
      - "&e➽ &fRechtsklick - Wirft eine Sichel, die"
      - "&fFeinde verdorren und entzünden lässt."
      - "&fSHIFT + Rechtsklick - Erzeugt einen Feuerschild,"
      - "&fder einen Teil des Schadens absorbiert."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    cloud_sword:
      - ""
      - "&e➽ &fRechtsklick - Erzeugt Wolken unter dem Spieler."
      - "&fRechtsklick (erneut) - Pausiert die Fähigkeit."
      - "&fVerhindert passiv Fallschaden."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    hypnosis_staff:
      - ""
      - "&e➽ &fRechtsklick - Hypnotisiert einen Mob,"
      - "&fder für dich kämpft."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    emerald_blade:
      - ""
      - "&e➽ &fRechtsklick - Öffnet ein Smaragd-Menü."
      - "&fMehr Smaragde bedeuten mehr Schaden."
      - "&fGetötete Wesen lassen Smaragde fallen."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    golem_hammer:
      - ""
      - "&e➽ &fRechtsklick - Schleudert den Besitzer hoch"
      - "&fund erzeugt bei der Landung eine"
      - "&fmächtige Welle, die Feinde zurückstößt."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    toxic_crossbow:
      - ""
      - "&e➽ &fRechtsklick - Feuert eine Ladung"
      - "&fund setzt eine Giftwolke frei, die"
      - "&fVergiftung und Schaden verursacht."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    lich_staff:
      - ""
      - "&e➽ &fRechtsklick - Feuert Eiskugeln,"
      - "&ffriert ein und stößt Feinde zurück."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    artemis_bow:
      - ""
      - "&e➽ &fSchuss - Verschießt einen Pfeil,"
      - "&fder Feinde mit etwas Glück verfolgt"
      - "&fund Blitze herabruft."
    midas_sword:
      - ""
      - "&e➽ &fWird mit jedem"
      - "&fKill stärker."
    poseidon_trident:
      - ""
      - "&e➽ &fSchuss - Wirft den Dreizack"
      - "&fund erzeugt einen Blitz."
      - "&fSHIFT + Rechtsklick - Strömung ohne Wasser."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    reinforced_elytra:
      - ""
      - "&e➽ &fSHIFT (im Flug) - Boost ohne Feuerwerk."
      - "&fErzeugt bei der Landung eine starke Explosion."
      - "&fDie Stärke hängt von der Fluggeschwindigkeit ab."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    ravager_horn:
      - ""
      - "&e➽ &fRechtsklick - Beschwört einen Verwüster,"
      - "&fden du reiten und mit dem du angreifen kannst."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    freezing_chakram:
      - ""
      - "&e➽ &fRechtsklick - Wirft einen Shuriken,"
      - "&fder Wesen einfriert und verlangsamt."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    sculkweavers_lantern:
      - ""
      - "&e➽ &fRechtsklick - Erzeugt eine Sculk-Sphäre"
      - "&fund beschwört freundliche Wächter."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    war_pick:
      - ""
      - "&e➽ &fTreffer - Fügt der Rüstung"
      - "&fhohen Haltbarkeitsschaden zu."
      - "&fAbbau - Bricht Blöcke 3x3x3."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    rework_elytra:
      - ""
      - "&e➽ &fSHIFT (im Flug) - Boost ohne Feuerwerk."
      - "&fErzeugt bei der Landung eine starke Explosion."
      - "&fDie Stärke hängt von der Fluggeschwindigkeit ab."
      - "&fBeschwört Geister, die angreifen."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    beehive_blaster:
      - ""
      - "&e➽ &fSchuss - Feuert einen Bienenstock,"
      - "&fder wütende Bienen erzeugt."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
    fugu_cannon:
      - ""
      - "&e➽ &fSchuss - Feuert drei aufgeblähte Kugelfische,"
      - "&fdie bei Berührung verletzen und vergiften."
      - ""
      - "&e➽ &fAbklingzeit: {cooldown} s"
