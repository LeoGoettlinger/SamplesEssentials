  # ============================================================
  # 5. ModBlocker — blocks known Minecraft mods
  #    Detects via plugin channel registration OR brand channel.
  #    Use `%mod%` placeholder in kick-reason to include mod name.
  # ============================================================
  mod-blocker:
    enabled: true
    kick-reason: "&c[AllayAC] &fMod &7%mod% &fis not allowed on this server."
    detect-via: "both"   # channels | brand | both
    mods:
      # --- MINIMAP MODS ---
      journeymap:
        block: true
        name: "JourneyMap"
        channels: ["journeymap:api", "journeymap:chunkdata", "journeymap:player_data_tracker"]
        brands: ["journeymap"]
      xaeros_minimap:
        block: false
        name: "Xaero's Minimap"
        channels: ["xaerominimap:main", "xaerominimap:obsync", "xaerominimap:newversion"]
        brands: ["xaeros_minimap", "xaerominimap"]
      xaeros_worldmap:
        block: false
        name: "Xaero's World Map"
        channels: ["xaeroworldmap:main"]
        brands: ["xaeros_worldmap", "xaeroworldmap"]
      mapwriter:
        block: true
        name: "MapWriter"
        channels: ["mapwriter:chunkdata", "mapwriter:fulldata"]
        brands: ["mapwriter"]
      voxelmap:
        block: true
        name: "VoxelMap"
        channels: ["voxelmap:chunkdata"]
        brands: ["voxelmap"]
      antique_atlas:
        block: true
        name: "Antique Atlas"
        channels: ["antiqueatlas:atlas"]
        brands: ["antiqueatlas"]
      # --- UTILITY/HACK MODS ---
      freecam:
        block: true
        name: "FreeCam"
        channels: []
        brands: ["freecam", "free_cam"]
      flashback:
        block: false
        name: "Flashback"
        channels: ["flashback:main", "flashback:record"]
        brands: ["flashback"]
      replay_mod:
        block: true
        name: "Replay Mod"
        channels: ["replaymod:replay_channel"]
        brands: ["replaymod"]
      world_downloader:
        block: true
        name: "World Downloader"
        channels: ["wdl:control", "wdl:init", "wdl:request"]
        brands: ["worlddownloader", "wdl"]
      schematica:
        block: true
        name: "Schematica"
        channels: ["schematica:printer", "schematica:peripheral"]
        brands: ["schematica"]
      litematica:
        block: false
        name: "Litematica"
        channels: ["litematica:printer"]
        brands: ["litematica"]
      minihud:
        block: true
        name: "MiniHUD"
        channels: ["minihud:packet_handler"]
        brands: ["minihud"]
      # --- HUD/INFORMATION MODS ---
      tod_3d:
        block: true
        name: "Time of Day 3D"
        channels: []
        brands: ["tod3d", "tod_3d"]
      dynamic_surroundings:
        block: true
        name: "Dynamic Surroundings"
        channels: []
        brands: ["dynamicsurroundings"]
      # --- RECORDING / TIMING MODS ---
      moon_time:
        block: true
        name: "Moon Time"
        channels: ["moontime:main"]
        brands: ["moontime"]
      # --- MULTIPLEX MODS ---
      multiconnect:
        block: true
        name: "multiconnect"
        channels: ["multiconnect:server_protocols"]
        brands: ["multiconnect"]
      # --- OTHER RESTRICTED MODS ---
      chest_tracker:
        block: true
        name: "ChestTracker"
        channels: ["chesttracker:main"]
        brands: ["chesttracker"]
      schematic:
        block: true
        name: "Schematic"
        channels: ["schematic:printer"]
        brands: []
      itemscroller:
        block: true
        name: "ItemScroller"
        channels: ["itemscroller:main"]
        brands: ["itemscroller"]
      tweaksfork:
        block: true
        name: "TweaksFork"
        channels: []
        brands: ["tweaksfork"]
  # ============================================================
  # 6. CrashItem — NBT exploit detection (oversized books/lores/names)
  # ============================================================
  crash-item:
    enabled: true
    kick-reason: "&c[AllayAC] &fCrash item exploit detected."
    max-book-page-chars: 16384
    max-book-pages: 100
    max-lore-lines: 50
    max-display-name-chars: 512
    action: "kick"
  # ============================================================
  # 7. OPProtection — block unauthorized OP attempts
  # ============================================================
  op-protection:
    enabled: false
    kick-reason: "&c[AllayAC] &fUnauthorized OP attempt blocked."
    block-unauthorized-op: true
    block-dangerous-commands: false
  # ============================================================
  # 8. CommandBlocker — block dangerous commands + hide tab-completion
  # ============================================================
  command-blocker:
    enabled: true
    kick-reason: "&c[AllayAC] &fBlocked command."
    blocked-commands: ["/stop","/restart","/reload","/save-all","/gamerule","//calc","//eval"]
    hide-from-tab-complete: false
    block-injection: true
  # ============================================================
  # 9. Lockdown — temporarily lock the server
  # ============================================================
  lockdown:
    enabled: true
    message: "&c[AllayAC] Server is in lockdown mode."
    allow-admins: true
    allow-whitelisted: true
  # ============================================================
  # 10. AutoClicker — CPS analysis + std-dev machine detection
  # ============================================================
  auto-clicker:
    enabled: true
    kick-reason: "&c[AllayAC] &fAutoClicker detected."
    flag-cps: 15
    hard-cps: 25
    sample-size: 20
  # ============================================================
  # 11. FastBow — flag players releasing bows too quickly
  # ============================================================
  fast-bow:
    enabled: true
    kick-reason: "&c[AllayAC] &fFastBow detected."
    min-charge-ms: 1000
  # ============================================================
  # 12. FastEat — flag players eating/drinking too quickly
  # ============================================================
  fast-eat:
    enabled: true
    kick-reason: "&c[AllayAC] &fFastEat detected."
    min-eat-ms: 1500
    exempt-creative: true
  # ============================================================
  # 13. FastHeal — flag unusually rapid healing
  # ============================================================
  fast-heal:
    enabled: true
    kick-reason: "&c[AllayAC] &fFastHeal detected."
    min-interval-ms: 1500
  # ============================================================
  # 14. ChatSpam — per-player rate limit + repeat detection
  # ============================================================
  chat-spam:
    enabled: true
    kick-reason: "&c[AllayAC] &fChat spam detected."
    max-messages-per-3s: 5
    max-repeats: 3
  # ============================================================
  # Auxiliary toggles
  # ============================================================
  database:
    enabled: true
  discord-webhook:
    enabled: true
  self-test:
    enabled: true
  bedrock-detection:
    enabled: true
  via-version-detection:
    enabled: true
  flag-event-listener:
    enabled: true
