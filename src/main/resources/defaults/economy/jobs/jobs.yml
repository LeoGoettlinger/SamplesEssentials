# UJobs jobs.yml (merged port).
#
# Supported action types in this build: kill, break, place, breed, tame, fish,
# enchant, harvest, smelt. A "*" key inside an action table matches any entity or
# material. Level requirements come from level_equation (<next_level>).
#
# The original also listened for anvil_merge, craft, trade, raid and
# generate_loot. Those are not captured by this port, so no job here claims
# rewards for them.

