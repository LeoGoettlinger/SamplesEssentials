  weapon-lore:
    sculk_crossbow:
      - ""
      - "&e➽ &fSHOOT - Fires a beam that"
      - "&ftriggers a sculk explosion"
      - "&fand spreads sculk."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    mjolnir:
      - ""
      - "&e➽ &fRMB - Throws a hammer that"
      - "&fstrikes foes with lightning,"
      - "&fthen returns to your hand."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    shadow_blade:
      - ""
      - "&e➽ &fRMB - Turns you temporarily"
      - "&finvisible and grants speed."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    reaper_scythe:
      - ""
      - "&e➽ &fHIT - Steals positive"
      - "&feffects and heals you."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    villager_staff:
      - ""
      - "&e➽ &fRMB - Creates a blast beam,"
      - "&fkilling entities and gaining"
      - "&femeralds."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    dragon_katana:
      - ""
      - "&e➽ &fRMB - Teleports you"
      - "&fin the direction you look."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    awakened_dragon_katana:
      - ""
      - "&e➽ &fRMB - Teleports you"
      - "&fwhere you look, leaving"
      - "&fa trail of explosions."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    excalibur:
      - ""
      - "&e➽ &fRMB - Grants you temporary"
      - "&fimmortality."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    void_staff:
      - ""
      - "&e➽ &fRMB - Opens portals"
      - "&fthat teleport between each other."
      - "&fRMB - Fires a shulker charge."
      - "&fLMB - Switches modes."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    magma_club:
      - ""
      - "&e➽ &fRMB - Ignites and knocks back"
      - "&fenemies with a fiery wave."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    shrink_ray:
      - ""
      - "&e➽ &fSHOOT - Fires a beam, enlarging"
      - "&fthe enemy several times."
      - "&fLMB - Shrinks you."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    chainsaw_sword:
      - ""
      - "&e➽ &fRMB - Curses the blade,"
      - "&fmaking the next hit cause bleeding."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    wither_sickles:
      - ""
      - "&e➽ &fRMB - Throws a sickle,"
      - "&fwithering enemies."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    awakened_wither_sickles:
      - ""
      - "&e➽ &fRMB - Throws a sickle, withering"
      - "&fand igniting enemies."
      - "&fSHIFT + RMB - Raises a fiery shield"
      - "&fthat absorbs a percent of damage."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    cloud_sword:
      - ""
      - "&e➽ &fRMB - Creates clouds beneath the player."
      - "&fRMB (again) - Pauses the ability."
      - "&fPassively prevents fall damage."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    hypnosis_staff:
      - ""
      - "&e➽ &fRMB - Hypnotizes a mob to"
      - "&ffight for you."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    emerald_blade:
      - ""
      - "&e➽ &fRMB - Opens an emerald menu."
      - "&fMore emeralds inside mean more damage."
      - "&fSlain entities drop emeralds."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    golem_hammer:
      - ""
      - "&e➽ &fRMB - Launches the owner, creating"
      - "&fa powerful shockwave on landing,"
      - "&fknocking back nearby enemies."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    toxic_crossbow:
      - ""
      - "&e➽ &fRMB - Fires a charge,"
      - "&freleasing a toxic cloud that deals"
      - "&fpoison and damage."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    lich_staff:
      - ""
      - "&e➽ &fRMB - Fires ice orbs,"
      - "&ffreezing and knocking back enemies."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    artemis_bow:
      - ""
      - "&e➽ &fSHOOT - Looses an arrow"
      - "&fthat may chase enemies"
      - "&fand call down lightning."
    midas_sword:
      - ""
      - "&e➽ &fGrows stronger with"
      - "&fevery kill."
    poseidon_trident:
      - ""
      - "&e➽ &fSHOOT - Throws the trident,"
      - "&fsummoning lightning."
      - "&fSHIFT + RMB - Riptide without water."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    reinforced_elytra:
      - ""
      - "&e➽ &fSHIFT (flying) - Boost without fireworks."
      - "&fCreates a powerful explosion on landing."
      - "&fExplosion power scales with flight speed."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    ravager_horn:
      - ""
      - "&e➽ &fRMB - Summons a ravager"
      - "&fyou can ride and attack on."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    freezing_chakram:
      - ""
      - "&e➽ &fRMB - Throws a chakram that"
      - "&ffreezes and slows entities."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    sculkweavers_lantern:
      - ""
      - "&e➽ &fRMB - Creates a sculk sphere,"
      - "&fsummoning friendly wardens."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    war_pick:
      - ""
      - "&e➽ &fHIT - Deals heavy damage"
      - "&fto armor durability."
      - "&fMINING - Breaks blocks 3x3x3."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    rework_elytra:
      - ""
      - "&e➽ &fSHIFT (flying) - Boost without fireworks."
      - "&fCreates a powerful explosion on landing."
      - "&fExplosion power scales with flight speed."
      - "&fSpawns spirits that attack the player."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    beehive_blaster:
      - ""
      - "&e➽ &fSHOOT - Fires a beehive"
      - "&fthat spawns angry bees."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
    fugu_cannon:
      - ""
      - "&e➽ &fSHOOT - Launches three puffed pufferfish"
      - "&fthat hurt and poison on contact."
      - ""
      - "&e➽ &fCooldown: {cooldown} s"
