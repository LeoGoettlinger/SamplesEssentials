name: Build SamplesEssentials

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        id: gradle
        continue-on-error: true
        run: |
          ./gradlew --no-daemon --console=plain build 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Publish build log (so it can be read without Actions access)
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "SamplesEssentials Bot"
          git config user.email "bot@samplecraft.su"
          git add -f build-log.txt
          git commit -m "chore: build log [skip ci]" || true
          git pull --rebase || true
          git push

      - name: Fail when the build failed
        if: steps.gradle.outcome == 'failure'
        run: exit 1

      - name: Upload jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SamplesEssentials-jar
          path: build/libs/SamplesEssentials-*.jar
          if-no-files-found: error

      - name: Attach jar to a release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/SamplesEssentials-*.jar
