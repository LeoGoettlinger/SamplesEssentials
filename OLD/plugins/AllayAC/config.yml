        brands: ["liquidbounce", "liquid_bounce", "lb-client"]
        channels: ["liquidbounce:main", "lb:channel"]
      sigma:
        block: true
        name: "Sigma"
        brands: ["sigma"]
        channels: ["sigma:main"]
      vape:
        block: true
        name: "Vape"
        brands: ["vape"]
        channels: ["vape:main", "vape:cosmetics"]
      ares:
        block: true
        name: "Ares"
        brands: ["ares"]
        channels: ["ares:main"]
      salhack:
        block: true
