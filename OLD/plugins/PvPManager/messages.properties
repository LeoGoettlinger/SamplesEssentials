# PvPStatus Command
Other_Status_Enabled = {prefix} &7Spieler &f{player} &7hat PvP aktiviert.
Others_Status_Disabled = {prefix} &7Spieler &f{player} &7hat PvP deaktiviert.
Self_Status_Disabled = {prefix} &7Du hast PvP deaktiviert.
Self_Status_Enabled = {prefix} &7Du hast PvP aktiviert.
# Tag Command
Tag_Timeleft = &7Du bist noch für &e{time} &7im Kampf.
Tag_Not_In_Combat = &7Du bist derzeit nicht im Kampf.

# Variables
Enabled = #6fc93eAktiviert
Disabled = #c9453eDeaktiviert
