# ChatClear Config.yml

# Can use & color codes
# You can use %player% in your config.yml

# This is the global message that is sent after chat was cleared
# You can disable this feature by setting the enabled: false.

enabled: true

chatclearmessage:
- '&8&m----------------------------------------------------'
- '&e&lChatClear &8&l&eChat has been cleared by %player%'
- '&8&m----------------------------------------------------'

# chatclear.clear Grants permission to use the /clearchat command, allowing the player to clear the chat for all users.
# This is the Message to the Player if they dont have permission to use the command.
NoPermission: "&e&lChatClear &8&l&cYou dont have permission to use command!"