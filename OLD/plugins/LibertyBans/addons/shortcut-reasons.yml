 # The special prefix used to identify a reason shortcut when executing commands
shortcut-identifier: '!'
 # If a staff member specifies an invalid shortcut, the command will be halted to prevent mistakes.
does-not-exist: '&cThere is no shortcut reason configured for &e%SHORTCUT_ARG%&c.'
 # Whether to enable this addon at all
enable: true
