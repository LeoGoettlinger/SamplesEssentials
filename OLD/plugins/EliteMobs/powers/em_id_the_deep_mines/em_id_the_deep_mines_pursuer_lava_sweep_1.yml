isEnabled: true
powerType: UNIQUE
eliteScript:
  Trigger:
    Events:
    - EliteMobDamagedByPlayerEvent
    - PlayerDamagedByEliteMobEvent
    Actions:
    - action: RUN_SCRIPT
      scripts:
      - Warning
    - action: RUN_SCRIPT
      wait: 20
      scripts:
      - LevJump
    - action: RUN_SCRIPT
      wait: 75
      scripts:
      - LavaSweep
    - action: RUN_SCRIPT
      wait: 135
      scripts:
      - LevJump
    Cooldowns:
      local: 330
      global: 50
  Warning:
    Actions:
    - action: PLAY_SOUND
      sValue: block.fire.extinguish
      Target:
        targetType: SELF
      repeatEvery: 10
      times: 4
    - action: SPAWN_PARTICLE
      particles:
      - particle: CLOUD
      Target:
        targetType: SELF
        coverage: 1.0
      repeatEvery: 5
      times: 8
  LevJump:
    Actions:
    - action: POTION_EFFECT
      potionEffectType: SLOW
      amplifier: 99
      duration: 40
      Target:
        targetType: SELF
    - action: POTION_EFFECT
      potionEffectType: LEVITATION
      amplifier: 4
      duration: 40
      Target:
        targetType: SELF
    - action: TELEPORT
      FinalTarget:
        targetType: NEARBY_PLAYERS
        range: 30
        offset: 0,10,0
      Target:
        targetType: SELF
      wait: 40
    - action: PUSH
      vValue: 0,-5,0
      Target:
        targetType: SELF
      wait: 45
  LavaSweep:
    Zone:
      shape: ROTATING_RAY
      Target:
        targetType: SELF
        offset: 0,3,0
      Target2:
        targetType: SELF
        offset: 0,7,7
      animationDuration: 60
      # pitchRotation: 3
      yawRotation: 360
    Actions:
    - action: POTION_EFFECT
      potionEffectType: SLOW
      amplifier: 99
      duration: 60
      Target:
        targetType: SELF
    - action: PLAY_SOUND
      sValue: block.lava.pop
      Target:
        targetType: SELF
      repeatEvery: 5
      times: 12
    - action: PLACE_BLOCK
      material: LAVA
      duration: 100
      Target:
        targetType: ZONE_FULL
      repeatEvery: 5
      times: 12
