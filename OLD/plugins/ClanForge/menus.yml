      material: DIAMOND_SWORD
      name: "&6#{rank} {name}"
      lore:
        - "&cKills: {kills}"
        - "&bLevel: {level}"
      custom_model_data: 0

  bases:
    title: "Clan Bases"
    size: 54
    slots:
      prev: 45
      next: 53
      back: 48
      set_base: 49
    item_template:
      material: ENDER_PEARL
      name: "&a{base_name}"
      lore:
        - "&7Click to teleport"
        - "&7Right-click to delete"
      action: "BASE_ACTION:{base_name}"
      custom_model_data: 0
    items:
      prev:
        material: ARROW
        name: "&ePrevious Page"
        lore: []
        action: "PAGE_PREV"
        custom_model_data: 0
      next:
        material: ARROW
        name: "&eNext Page"
        lore: []
        action: "PAGE_NEXT"
        custom_model_data: 0
