  prefix: "&6&lᴘɪxᴇʟᴀᴛᴛᴀᴄᴋ &8▸ "
  no-permission: "&cDu hast keine Berechtigung fuer diesen Befehl."
  player-only: "&cDieser Befehl kann nur von einem Spieler ausgefuehrt werden."
  invalid-coordinates: "&cUngueltige Koordinaten. Verwendung: /darkdrop spawn <x> <y> <z>"
  invalid-number: "&cUngueltige Zahl: &e{value}&c."
  random-failed: "&cKonnte keine sichere Zufallsposition finden. Versuche es erneut."
  drop-start-title: "&5&lDARKDROP"
  drop-start-subtitle: "&7Ein mysterioeser Drop sinkt herab..."
  drop-start-chat: "&5&lDarkDrop &7startet! Ein Drop sinkt &5100 Bloecke &7ueber dir herab."
  drop-land-title: "&5&lEINSCHLAG"
  drop-land-subtitle: "&7Der DarkDrop ist gelandet!"
  drop-land-chat: "&5&lDarkDrop &7ist eingeschlagen!"
  actionbar-descending: "&5DarkDrop &7sinkt... &eHoehe: &f{height} &7Bloecke &8| &eRestzeit: &f{seconds}s"
