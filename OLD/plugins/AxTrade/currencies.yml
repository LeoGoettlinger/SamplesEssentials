# DOCUMENTATION: https://docs.artillex-studios.com/axtrade.html

# you can create your own currencies by using placeholders
# make sure that none of the placeholders have any formatting on them
# requires PlaceholderAPI
placeholder-currencies:
  Example-Currency:
    register: false
    name: money
    # if the currency uses whole numbers, then disable this
    # 100.5 - true
    # 100 - false
    uses-double: true
    # if the placeholder gets parsed even for offline players, enable this
    works-offline: false
    settings:
      raw-placeholder: '%coinsengine_balance_short_cheatcoins%'
      give-command: cheatcoins give %player% %amount%
      take-command: cheatcoins take %player% %amount%

# INFO FOR MULTI CURRENCY PLUGINS: (like: coinsengine, ultraeconomy, rediseconomy)
# - you can enable as many currencies as you want
# - 'currency-name' is from the currency plugin and 'name' is what AxTrade will display in trade summaries
# - in the guis.yml you will have to use <name of plugin>-<currency-name> format, for example: 'CoinsEngine-coins'
currencies:
  Experience:
    register: true
    name: exp
    # optional: tax (example: 5 is 5% tax)
    tax: 0
    # optional: minimum amount of currency needed in a trade, otherwise players can't accept the trade
    required: 0
  Vault:
    register: true
    name: money
  PlayerPoints:
    register: false
    name: points
  RoyaleEconomy:
    register: false
    name: money
  # note: you will have to use the currency name "CoinsEngine-coins" for example when using a multi currency plugin!
  CoinsEngine:
    register: false
    enabled:
    - currency-name: cheatcoins
      name: CheatCoins
    - currency-name: amethysts
      name: Amethysts
  # note: you will have to use the currency name "ExcellentEconomy-coins" for example when using a multi currency plugin!
  ExcellentEconomy:
    register: false
    enabled:
    - currency-name: cheatcoins
      name: CheatCoins
    - currency-name: amethysts
      name: Amethysts
  # note: you will have to use the currency name "UltraEconomy-coins" for example when using a multi currency plugin!
  UltraEconomy:
    register: false
    enabled:
    - currency-name: coins
      name: coins
  KingdomsX:
    register: false
    name: nexus points
  RivalHarvesterHoes:
    register: false
    name: essence
  SuperMobCoins:
    register: false
    name: mobcoin
  TheOnly-MobCoins:
    register: false
    name: mobcoins
  TokenManager:
    register: false
    name: tokens
  AxQuestBoard:
    register: false
    name: quest points
  AxHoes:
    register: false
    name: essence
  # note: you will have to use the currency name "RedisEconomy-coins" for example when using a multi currency plugin!
  RedisEconomy:
    register: false
    enabled:
    - currency-name: coins
      name: coins
  BeastTokens:
    register: false
    name: tokens
  # note: you will have to use the currency name "EcoBits-coins" for example when using a multi currency plugin!
  EcoBits:
    register: false
    enabled:
    - currency-name: crystals
      name: crystals
  RivalCredits:
    register: false
    name: credits

# do not change this
version: 11
