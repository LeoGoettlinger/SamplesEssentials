global:
  enabled: true
  verbose: true
messages:
  language: "de"
  prefix: "&6&lᴘɪxᴇʟʀᴇᴀʟᴍ &8▸ "
platform:
  bedrock:
    name-prefix: "."
    exempt-from-checks: true
    log-joins: true
  viaversion:
    version-aware-checks: true
    log-versions: false
advanced:
  self-test-on-startup: true
  max-ping-for-checks: -1
  min-tps-for-checks: -1
database:
  enabled: true
  file: "violations.db"
  flush-interval-ms: 1000
  max-records-per-player: 1000
  auto-delete-days: 90
modules:
  # ============================================================
  # 1. AntiVPN — IP/Proxy detection via ip-api.com + ipinfo.io
  # ============================================================
  anti-vpn:
    enabled: true
    kick-reason: "&c[AllayAC] &fVPN / Proxy connections are not allowed."
    provider: "both"
    max-requests-per-hour: 100
    cache-ttl-hours: 24
    action: "kick"
    skip-private-ips: true
  # ============================================================
  # 2. AntiBot — IP rate limit + bot-like name patterns
  # ============================================================
  anti-bot:
    enabled: false
    kick-reason: "&c[AllayAC] &fBot connection detected."
    max-joins-per-ip: 3
    max-joins-per-minute: 10
    flag-name-patterns: [".*\\d{4,}.*", ".*(bot|hack|cheat).*"]
    action: "kick"
  # ============================================================
  # 3. ClientBlocker — BLACKLIST of clients (kick when block=true)
  #    Each entry: block=true  -> kick the player using this client
  #                block=false -> log only, player allowed
  #    Hack clients are NOT listed here — they're in HackBlocker.
  #    This is the admin's free-form blacklist: flip block=true on
  #    any legit/utility client to disallow it on the server.
  # ============================================================
  client-blocker:
    enabled: true
    kick-reason: "&c[AllayAC] &fClient &7%client% &fis not allowed on this server."
    log-legitimate: true
    log-unknown: true
    clients:
      # --- LEGITIMATE CLIENTS (block: false = allow+log, block: true = kick) ---
      vanilla:           { name: "Vanilla",          type: legit,      block: false }
      lunarclient:       { name: "Lunar Client",     type: legit,      block: false }
      badlion:           { name: "Badlion Client",   type: legit,      block: true }
      labymod:           { name: "LabyMod",          type: legit,      block: false }
      feather:           { name: "Feather Client",    type: legit,      block: false }
      pvplounge:         { name: "PvPLounge",         type: legit,      block: true }
      # --- MODLOADERS ---
      forge:             { name: "Forge",             type: modloader,  block: true }
      fabric:            { name: "Fabric",            type: modloader,  block: false }
      quilt:             { name: "Quilt",             type: modloader,  block: false }
      neoforge:          { name: "NeoForge",         type: modloader,  block: false }
      rift:              { name: "Rift",              type: modloader,  block: true }
      liteloader:        { name: "LiteLoader",        type: modloader,  block: true }
      risugamis_modloader: { name: "Risugami's ModLoader", type: modloader, block: true }
      # --- UTILITY ---
      optifine:          { name: "OptiFine",          type: utility,    block: true }
      essentials:        { name: "EssentialsX Brand", type: utility,    block: false }
      # --- SERVER SOFTWARE ---
      spigot:            { name: "Spigot",             type: legit,      block: false }
      paper:             { name: "Paper",              type: legit,      block: false }
  # ============================================================
  # 4. HackBlocker — BLOCKS hack clients (single source of truth)
  #    Each hack-client entry has BOTH `brands` (matched against
  #    minecraft:brand plugin message) AND `channels` (matched
  #    against custom registered plugin channels). Use the
  #    %client% placeholder in kick-reason to include the client
  #    name in the kick message.
  # ============================================================
  hack-blocker:
    enabled: true
    kick-reason: "&c[AllayAC] &fHack client &7%client% &fis not allowed."
    max-payload-size: 32767
    clients:
      # --- MAJOR HACK CLIENTS (block: true) ---
      wurst:
        block: true
        name: "Wurst"
        brands: ["wurst"]
        channels: ["wurst:main", "wurst:settings"]
      impact:
        block: true
        name: "Impact"
        brands: ["impact"]
        channels: ["impact:main", "impact:command"]
      liquidbounce:
        block: true
