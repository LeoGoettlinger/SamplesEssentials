eliteScript:
  ActivateMobs:
    Events:
    - EliteMobDamagedEvent
    - ElitePhaseSwitchEvent
    - PlayerDamagedByEliteMobEvent
    - EliteMobTargetPlayerEvent
    Actions:
    - action: TITLE_MESSAGE
      wait: 100
      title: '&cWorshippers'
      subtitle: '&caid me!!!'
      Target:
        targetType: NEARBY_PLAYERS
        range: 20
      duration: 30
      fadeIn: 5
      fadeOut: 5
    - action: PLAY_SOUND
      wait: 100
      sValue: entity.elder_guardian.ambient
      Target:
        targetType: SELF
      repeatEvery: 10
      times: 4
    - action: TELEPORT
      wait: 115
      Target:
        targetType: NEARBY_MOBS
        range: 80
      FinalTarget:
        targetType: LOCATION
        location: same_as_boss,37.5,94,-12.5,0,0
      Conditions:
        hasTags:
        - Phase3
        Target:
          targetType: ACTION_TARGET
    - action: UNTAG
      Target:
        targetType: NEARBY_MOBS
        range: 80
      tags:
      - Warn
      Conditions:
        hasTags:
        - Phase3
        Target:
          targetType: ACTION_TARGET
    - action: NAVIGATE
      wait: 120
      Target:
        targetType: NEARBY_MOBS
        range: 80
      FinalTarget:
        targetType: SELF
      velocity: 3.0
      bValue: false
      duration: 185
      Conditions:
        hasTags:
        - Phase3
        Target:
          targetType: ACTION_TARGET
    - action: SET_MOB_AI
      wait: 110
      Target:
        targetType: NEARBY_MOBS
        range: 80
      bValue: true
      Conditions:
        hasTags:
        - Phase3
        Target:
          targetType: ACTION_TARGET
    - action: MAKE_INVULNERABLE
      wait: 110
      Target:
        targetType: NEARBY_MOBS
        range: 80
      invulnerable: false
      Conditions:
        hasTags:
        - Phase3
        Target:
          targetType: ACTION_TARGET
    Cooldowns:
      local: 6100
      global: 60
