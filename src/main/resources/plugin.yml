name: SamplesEssentials
version: ${version}
main: su.samplecraft.essentials.SamplesEssentials
api-version: '26.2'
authors: [SampleCraft]
description: All-in-one essentials suite for Paper 26.2-26.3 - every former plugin is now a toggleable module.
website: https://github.com/LeoGoettlinger/SamplesEssentials
softdepend: [VaultUnlocked, Vault]

commands:
  # root / admin
  samplese:
    description: Root admin command (status, reload, toggle, module info)
    usage: /samplese <status|reload|toggle <categoria/module>|modules|version>
    aliases: [se]
    permission: samplese.admin
  # chat
  clearchat:
    description: Clear the server chat
    usage: /clearchat [reason]
    permission: samplese.chat.clear
  chatclear:
    description: Alias of /clearchat
    usage: /chatclear [reason]
    permission: samplese.chat.clear
  announcements:
    description: List or trigger chat announcements
    usage: /announcements [send <index>]
    permission: samplese.chat.announce
  # general
  starterkit:
    description: Give yourself the starter kit
    usage: /starterkit
  # rtp
  rtp:
    description: Teleport to a random safe location
    usage: /rtp [world]
  forcertp:
    description: Force a random teleport
    usage: /forcertp [player]
    permission: samplese.rtp.force
  tpr:
    description: Lightweight random teleport
    usage: /tpr
    permission: samplese.rtp
  premiumrtp:
    description: Premium random teleport with world bounds
    usage: /premiumrtp
    permission: samplese.rtp.premium
  # gameplay
  biggerenderchest:
    description: Open your bigger ender chest
    usage: /biggerenderchest [see <player>|reload]
    aliases: [bec, ec]
  ecsee:
    description: Open another player's ender chest through the selector GUI
    usage: /ecsee [player]
    permission: samplese.biggerenderchest.see
  amethysttools:
    description: Give yourself an amethyst tool
    usage: /amethysttools <pickaxe|axe|shovel|hoe>
    permission: samplese.amethysttools
  sit:
    description: Sit down where you are looking
    usage: /sit
  dragoneggcoords:
    description: Show where the dragon egg currently is
    usage: /dragoneggcoords
    permission: samplese.dragonegg
  eggcoords:
    description: Alias of /dragoneggcoords
    usage: /eggcoords
    permission: samplese.dragonegg
  spawnelytra:
    description: Configure the spawn elytra
    usage: /spawnelytra [give]
    permission: samplese.spawnelytra
  # moderation
  vanish:
    description: Toggle vanish
    usage: /vanish
    permission: samplese.staff
  socialspy:
    description: Toggle social spy
    usage: /socialspy
    permission: samplese.staff
  staffchat:
    description: Send a message to staff
    usage: /staffchat <message>
    aliases: [sc]
    permission: samplese.staff
  freeze:
    description: Freeze or unfreeze a player
    usage: /freeze <player|all>
    permission: samplese.freeze
  unfreeze:
    description: Unfreeze a player
    usage: /unfreeze <player|all>
    permission: samplese.freeze
  freezelist:
    description: List frozen players
    usage: /freezelist
    permission: samplese.freeze
  bounty:
    description: Open the bounty menu, or add a bounty
    usage: /bounty [add <player> <amount>]
    permission: samplese.bounty
  rewards:
    description: Open the rewards menu
    usage: /rewards [gui|claim|reload|edit-user|set-playtime]
    permission: samplese.rewards
  sign:
    description: Sign, lock or delete the signature of the held item
    usage: /sign [text|delete|lock|unlock|help|version]
    permission: samplese.signitem
  rename:
    description: Rename the item in your hand
    usage: /rename <text>
    permission: samplese.signitem.rename
  xaero:
    description: Force fair-mode or disable the Xaero minimap
    usage: /xaero <scope> <fair-mode|disable> [true|false|unset]
    permission: samplese.xaero
  sli:
    description: Save your inventory and clear it
    usage: /sli [confirm]
    permission: samplese.localinv
  lli:
    description: Load your saved inventory
    usage: /lli
    permission: samplese.localinv
  ali:
    description: Open another player's saved inventory
    usage: /ali <player>
    permission: samplese.localinv.admin
  openinv:
    description: Open a player inventory
    usage: /openinv [player]
    permission: samplese.openinv
  openender:
    description: Open a player ender chest
    usage: /openender [player]
    permission: samplese.openinv
  leveltools:
    description: Manage LevelTools
    usage: /leveltools <reload|resetall|resethand|info>
    aliases: [lt]
    permission: samplese.leveltools
  ca:
    description: Open the auction house
    usage: /ca [sell|bid <price>|view|listed|expired]
    aliases: [auction, crazyauctions]
    permission: samplese.auction
  maintenance:
    description: Manage maintenance mode
    usage: /maintenance [on|off|status|starttimer|endtimer|aborttimer|schedule|whitelist|setmotd|setreason|reload|dump]
    permission: samplese.maintenance
  home:
    description: Open your homes menu
    usage: /home [name|list]
    aliases: [homes]
    permission: samplese.homes
  sethome:
    description: Set a home
    usage: /sethome [name]
    permission: samplese.homes
  delhome:
    description: Delete a home
    usage: /delhome <name>
    permission: samplese.homes
  homeadmin:
    description: Administer homes
    usage: /homeadmin <view|delete|import|reload>
    permission: samplese.homes.admin
  order:
    description: Buy-order market
    usage: /order [new|browse|history|deliver|cancel|collect]
    aliases: [orders]
    permission: samplese.orders
  orderadmin:
    description: Administer the order market
    usage: /orderadmin <list|purge|refund>
    permission: samplese.orders.admin
  tags:
    description: List and preview fancy chat tags
    usage: /tags [list|test|reload|<tag>]
    aliases: [fancytags]
    permission: samplese.tags
  grave:
    description: List, teleport to and open your graves
    usage: /grave <list|tp|open|count|reload>
    aliases: [graves]
    permission: samplese.graves
  # social
  friend:
    description: Open the friend menu (add, remove, list, requests)
    usage: /friend <add|remove|list|requests|accept|deny|level> [player]
    permission: samplese.friends
  msf:
    description: Message a friend, or toggle a private chat with them
    usage: /msf <player> <message> | /msf toggle <player>
    permission: samplese.friends
  friendz:
    description: Friend system info and reload
    usage: /friendz [reload]
    permission: samplese.friends
  # world
  unloadworld:
    description: Unload a world
    usage: /unloadworld <world>
    permission: samplese.admin
  chunkmanager:
    description: Chunk / memory utilities
    usage: /chunkmanager <status|gc>
    permission: samplese.admin
  smartspawner:
    description: Inspect and edit spawners
    usage: /smartspawner <info|set <entity>>
    permission: samplese.smartspawner

permissions:
  samplese.*:
    description: Full access to every SamplesEssentials module
    default: op
    children:
      samplese.admin: true
      samplese.chat.clear: true
      samplese.chat.announce: true
      samplese.chat.format: true
      samplese.rtp: true
      samplese.rtp.premium: true
      samplese.rtp.force: true
      samplese.staff: true
      samplese.freeze: true
      samplese.amethysttools: true
      samplese.spawnelytra: true
      samplese.smartspawner: true
  samplese.admin:
    description: Full admin access to SamplesEssentials
    default: op
  samplese.chat.clear:
    description: Clear the server chat
    default: op
  samplese.chat.announce:
    description: Manage announcements
    default: op
  samplese.chat.format:
    description: Use colour codes in chat
    default: op
  samplese.rtp:
    description: Use random teleport
    default: true
  samplese.rtp.premium:
    description: Use premium random teleport
    default: op
  samplese.rtp.force:
    description: Force random teleports for other players
    default: op
  samplese.staff:
    description: Access staff tools (vanish, socialspy, staffchat)
    default: op
  samplese.freeze:
    description: Freeze other players
    default: op
  samplese.amethysttools:
    description: Receive amethyst tools
    default: op
  samplese.spawnelytra:
    description: Manage the spawn elytra module
    default: op
  samplese.smartspawner:
    description: Use smart spawner commands
    default: op
  samplese.biggerenderchest.see:
    description: Open other players' ender chests
    default: op
  samplese.biggerenderchest:
    description: Open your bigger ender chest
    default: true
  samplese.dragonegg:
    description: Use /dragoneggcoords
    default: true
  samplese.friends:
    description: Use the friend system
    default: true
  samplese.bounty:
    description: Use the bounty system
    default: true
  samplese.signitem:
    description: Sign and lock items
    default: true
  samplese.signitem.rename:
    description: Rename items
    default: true
  samplese.signitem.admin:
    description: Remove signatures and locks of other players
    default: op
  samplese.signitem.autolock:
    description: Auto-lock every signed item
    default: op
  samplese.xaero:
    description: Edit Xaero minimap settings
    default: op
  samplese.rewards:
    description: Use /rewards
    default: true
  samplese.rewards.admin:
    description: Edit reward data
    default: op
  samplese.localinv:
    description: Use inventory saves
    default: true
  samplese.localinv.admin:
    description: Open other players' inventory saves
    default: op
  samplese.openinv:
    description: Open inventory views
    default: true
  samplese.openinv.other:
    description: Open other players' inventories
    default: op
  samplese.openinv.modify:
    description: Modify inventories opened with /openinv
    default: op
  samplese.openinv.offline:
    description: Open offline players' inventories
    default: op
  samplese.openinv.ender:
    description: Open ender chests
    default: op
  samplese.openinv.exempt:
    description: Exempt from equal-access checks
    default: op
  samplese.leveltools:
    description: Use LevelTools
    default: true
  samplese.leveltools.admin:
    description: Administer LevelTools
    default: op
  samplese.auction:
    description: Use the auction house
    default: true
  samplese.auction.admin:
    description: Administer the auction house
    default: op
  samplese.auction.selling:
    description: Create sell listings
    default: true
  samplese.auction.bidding:
    description: Create bid listings
    default: true
  samplese.maintenance:
    description: Manage maintenance mode
    default: op
  samplese.maintenance.bypass:
    description: Join during maintenance
    default: op
  samplese.homes:
    description: Use homes
    default: true
  samplese.homes.unlimited:
    description: Unlimited homes
    default: false
  samplese.homes.cooldown.bypass:
    description: Skip the home teleport countdown
    default: op
  samplese.homes.admin:
    description: Administer homes
    default: op
  samplese.orders:
    description: Use the order market
    default: true
  samplese.orders.admin:
    description: Administer the order market
    default: op
  samplese.tags:
    description: Use /tags
    default: true
  samplese.tags.admin:
    description: Reload tags
    default: op
  samplese.graves:
    description: Create and use graves
    default: true
  samplese.graves.other:
    description: Open and loot other players' graves
    default: op
  samplese.friends.bypasslimit:
    description: Bypass the friend limit
    default: op
