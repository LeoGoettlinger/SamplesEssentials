  prefix: "&6&lɴɪxᴏʀɪᴀ ʀᴇᴡᴀʀᴅs &8▸ "
  reload: "&#b7faa2 Rewards System wurde neu geladen! &#66b04f🔃"
  reminder: "%prefix% &#ffe27a Sammle jetzt deine Rewards ein!: &#ffc940/rewards claim"
