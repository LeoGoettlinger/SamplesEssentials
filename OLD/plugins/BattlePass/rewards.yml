# ================================
# BattlePass Rewards Configuration
# Plugin by ResistanceCore
# ================================
#
# ✅ FIXED: Removed redundant 'premium-only' field
# Use ONLY 'type' field now:
#   - type: FREE    → All players can claim
#   - type: PREMIUM → Only premium players can claim
# 
# ⚠️ CUSTOM ITEMS (Oraxen/ItemsAdder):
# - DO NOT use "oraxen-id" or "itemsadder-id" anymore
# - Use Tier Editor GUI: /bpadmin editor
# - Hold custom item in hand → Click "Add Item from Hand"
# - This preserves FULL NBT data for ANY custom item!

rewards:
  # ==================
  # TIER 1 REWARDS
  # ==================
  tier_1_free:
    tier: 1
    name: "&aStarter Pack"
    description: "Welcome to the BattlePass!"
    type: FREE  # ✅ All players
    # ❌ REMOVED: premium-only: false
    items:
      - material: DIAMOND
        amount: 5
      - material: GOLDEN_APPLE
        amount: 3
    commands:
      - "give %player% minecraft:experience_bottle 5"
    display-item:
      material: CHEST
      name: "&aStarter Pack"
      lore:
        - "&75x Diamonds"
        - "&73x Golden Apples"
        - "&75x XP Bottles"
  
