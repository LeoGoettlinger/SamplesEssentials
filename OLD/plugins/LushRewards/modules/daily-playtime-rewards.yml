gui:
  title: "    &#529bf2&lDaily Playtime Rewards"
  scroll-type: FIXED
  template: "BORDERED_LARGE"
  item-templates:
    default-reward:
      material: clock
      display-name: "&#f5e389%minutes% Minutes"
    redeemable-reward:
      material: clock
      display-name: "&#f5e389%minutes% Minutes - &#a5f5a5Redeemable!"
      enchanted: true
    collected-reward:
      material: clock
      display-name: "&#f5e389%minutes% Minutes - &#7d7d7dCollected"
    'P':
      material: player_head
      display-name: "&#A5B8FE&lProfile:"
      skull-texture: mirror
      lore:
        - "&#c4f8ffNext Reward in: &f%lushrewards_daily-playtime-rewards_time_until_next_reward%"
        - "&#c4f8ffToday's Playtime: &f%lushrewards_daily-playtime-rewards_playtime%"
