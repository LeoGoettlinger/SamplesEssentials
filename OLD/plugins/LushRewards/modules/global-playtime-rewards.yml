# ============================================
# Global Playtime Rewards - Lifetime Meilensteine
# Reset: Nie (0 = lifetime tracking)
# ============================================
type: playtime-rewards
enabled: true

# How often (in days) to reset (0 to disable = lifetime)
reset-playtime-at: 0
# Time in minutes between checking whether any online players need to receive rewards
refresh-time: 15
# Whether notifications should be sent when rewards are claimable
enable-notifications: true

goals:
  # ============ FRÜHGAME (0-10h) ============
  - play-minutes: 30       # 30 Minuten
    display-item:
      material: clock
      amount: 1
    rewards:
      - type: item
        material: bread
        amount: 16
      - type: item
        material: torch
        amount: 32

  - play-minutes: 60       # 1 Stunde
