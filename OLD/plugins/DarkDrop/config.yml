# DarkDrop Konfiguration
# Alle Texte koennen hier angepasst werden. Standardmaessig deutsch.
# Farben mit & (z.B. &c rot, &a gruen, &e gelb).

settings:
  # Standard-Spawn-Hoehe ueber der Zielposition in Bloecken
  spawn-height: 100
  # Sinkgeschwindigkeit in Bloecken pro Sekunde (kleiner = langsamer)
  descend-speed: 5.0
  # Update-Intervall in Ticks (20 Ticks = 1 Sekunde)
  update-interval-ticks: 4
  # Hoehe ab der die Sinkphase mit Actionbar beginnt (in Bloecken ueber Ziel)
  announce-height: 100

random-spawn:
  # Mindestabstand vom Spieler fuer zufaellige Drops
  min-distance: 30
  # Maximaler Abstand vom Spieler fuer zufaellige Drops
  max-distance: 200
  # Sicherheitsabstand zur Weltgrenze in Bloecken
  world-border-margin: 64
  # Minimale Hoehe ueber dem Boden fuer die Landung
  min-safe-y: 60
  # Maximale Hoehe ueber dem Boden fuer die Landung
  max-safe-y: 200

bad-loot:
  # Schaden fuer die kleine Explosion (0.0 = kein Schaden, 1.0 = 1 halbes Herz)
  explosion-damage: 4.0
  # Feuer-Dauer in Sekunden
  fire-duration-seconds: 3
  # Feuer-Radius um die Landeposition
  fire-radius: 2
  # Blitz-Schaden (0 = kein Schaden)
  lightning-damage: 0.0
  # Negative Effekt-Dauer in Sekunden
  effect-duration-seconds: 8
  # Effekt-Amplifikator (0 = Stufe 1)
  effect-amplifier: 1

