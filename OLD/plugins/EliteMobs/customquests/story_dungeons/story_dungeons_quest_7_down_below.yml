questLore:
- Well, if it isn’t our thirty-sixth-best guild member.
- The next area we are sending you to seems to be some kind of quarry?
- I guess the dwarves just kept digging further down.
- The madmen should have considered the dangers of digging that deep down...
- But, too late for that now. It would be of great help if you could go to the quarry
  and figure out how to get the lift moving.
